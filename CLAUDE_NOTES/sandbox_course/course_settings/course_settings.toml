[relative_due_dates]
# When true, `generate-due-dates` sets every lock date after the term file's
# last_day, and every lock rule of "NONE", to last_day at 23:59 (term time zone).
# Items with no lock rule are left as they are. A table may set it too.
# clamp_lock_at_to_last_day_of_term = true

days_of_week = ["Mon", "Wed"]
unlock_relative_default = "NONE"
lock_relative_default = "+7 CALENDAR_DAY"
default_unlock_time = "00:00"
default_lock_time = "23:59"
dont_reschedule_dates_before = "2026-10-03"

[relative_due_dates.tables.default]
